[project]
name = "verso"
version = "0.1.0"
description = "Resume parser that proves nothing was silently dropped"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    "lxml>=5.3",
    "ftfy>=6.3",
    "rapidfuzz>=3.10",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "openai>=3.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
